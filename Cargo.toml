[package]
name = "voidgate"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "DNS sinkhole ad blocker with per-device and per-network policies"
license = "MIT"
publish = false

[dependencies]
tokio = { version = "1.53.3", features = [
    "rt-multi-thread",
    "net",
    "time",
    "sync",
    "signal",
    "macros",
    "io-util",
] }
hickory-proto = "0.26.3"
rand = "0.10.3"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_yaml_ng = "0.10.0"
ipnet = { version = "2.12.2", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
arc-swap = "1.9.3"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
assert_cmd = "2.2.2"

[profile.release]
lto = "thin"
strip = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[lints.rust]
missing_docs = "warn"

[[bin]]
name = "voidgate"
path = "src/main.rs"
